[package]
name = "app"
version = "0.2.0"
description = "Plot, a small local-first project tracker"
authors = ["Alfred Tång"]
license = "MIT"
repository = "https://github.com/oelburk/plot"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
